# 备选：仅在无本机 MySQL/Redis 时启用
# 本机已有 MySQL 8.4 (3306) / Redis (6379) 则无需启动
services:
  mysql:
    image: mysql:8.4
    container_name: harness-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-harness_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-harness}
      MYSQL_USER: ${MYSQL_USER:-harness}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-harness}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: harness-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
